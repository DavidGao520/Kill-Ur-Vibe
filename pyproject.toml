[project]
name = "kill-ur-vibe"
version = "0.0.1"
description = "Authorized active security-assessment CLI for AI-built web apps."
requires-python = ">=3.11"
# The deterministic core (decoders, severity, egress policy) and the SDK-free tool
# core (kuv.agent.session) are pure stdlib. These deps are only needed to RUN the
# agent spine (kuv.agent.spine) against a target.
dependencies = [
    "pyyaml>=6.0",
    "claude-agent-sdk>=0.1.0",
    "httpx>=0.27",
    "dnspython>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kuv"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
